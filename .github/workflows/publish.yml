name: Publish

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm with provenance
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Require npm Trusted Publishing support
        shell: bash
        run: |
          npm_version="$(npm --version)"
          node -e "const [major, minor, patch] = '$npm_version'.split('.').map(Number); if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) throw new Error('npm 11.5.1 or newer is required for Trusted Publishing; found $npm_version')"

      - name: Require package version to match the Git tag
        run: node -e "const version = require('./package.json').version; if (version !== process.env.GITHUB_REF_NAME) throw new Error('Tag ' + process.env.GITHUB_REF_NAME + ' does not match package version ' + version)"

      - name: Verify source, tests, build, and package contents
        run: npm run verify

      - name: Publish release with npm Trusted Publishing
        run: npm run release

      - name: Wait for the published version to become available
        shell: bash
        run: |
          package="n8n-nodes-elvesora-enrichment@${GITHUB_REF_NAME}"
          for attempt in {1..12}; do
            if npm view "$package" version >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "Published package did not become visible: $package" >&2
          exit 1

      - name: Run the n8n community-package scanner
        shell: bash
        run: |
          set -euo pipefail
          package="n8n-nodes-elvesora-enrichment@${GITHUB_REF_NAME}"
          for attempt in {1..5}; do
            set +e
            scan_output="$(npx --yes @n8n/scan-community-package@0.32.0 "$package" 2>&1)"
            scan_status=$?
            set -e
            printf '%s\n' "$scan_output"

            if grep -Fq 'has passed all security checks' <<<"$scan_output"; then
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "n8n scanner did not confirm a passing package after $attempt attempts (last exit: $scan_status)." >&2
              exit 1
            fi

            sleep "$((attempt * 10))"
          done

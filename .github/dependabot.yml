version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Current @n8n/node-cli lint tooling is not compatible with these majors.
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    # Keep dependency alerts enabled without creating update branches or pull requests.
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Keep the repository on its direct-to-main workflow.
    open-pull-requests-limit: 0
